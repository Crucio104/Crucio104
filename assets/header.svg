<svg width="100%" height="200" viewBox="0 0 900 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#300A13" />
      <stop offset="50%" stop-color="#4A121E" />
      <stop offset="100%" stop-color="#22060C" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBB89D" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#E8DFD8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#CBB89D" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBB89D" stop-opacity="0" />
      <stop offset="50%" stop-color="#CBB89D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#CBB89D" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .name-title {
      font-family: 'Cinzel', 'Playfair Display', 'Times New Roman', 'Baskerville', serif;
      font-size: 38px;
      font-weight: 600;
      letter-spacing: 5px;
      fill: #F7F4EE;
    }
    .current-degree {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 1.5px;
      fill: #E8DFD8;
    }
    .alumnus-degree {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 1.2px;
      fill: #CBB89D;
    }
    .discipline-tags {
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      fill: #D4C5B9;
      opacity: 0.85;
    }
    @keyframes subtleBreathe {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.7; }
    }
    .breathe {
      animation: subtleBreathe 6s ease-in-out infinite;
    }
  </style>

  <!-- Frame Background -->
  <rect x="2" y="2" width="896" height="196" rx="6" fill="url(#headerBg)" stroke="url(#borderGrad)" stroke-width="1" />

  <!-- Geometric Corner Accents -->
  <path d="M 12 24 L 12 12 L 24 12" stroke="#CBB89D" stroke-width="1" fill="none" opacity="0.6" />
  <path d="M 888 24 L 888 12 L 876 12" stroke="#CBB89D" stroke-width="1" fill="none" opacity="0.6" />
  <path d="M 12 176 L 12 188 L 24 188" stroke="#CBB89D" stroke-width="1" fill="none" opacity="0.6" />
  <path d="M 888 176 L 888 188 L 876 188" stroke="#CBB89D" stroke-width="1" fill="none" opacity="0.6" />

  <!-- Subtle Ambient Glow -->
  <circle cx="450" cy="100" r="140" fill="#7B1F33" opacity="0.25" filter="blur(30px)" class="breathe" />

  <!-- Name -->
  <text x="450" y="68" text-anchor="middle" class="name-title">ALESSIO CURCIO</text>

  <!-- Divider line -->
  <line x1="280" y1="84" x2="620" y2="84" stroke="url(#accentLine)" stroke-width="1" />
  <circle cx="450" cy="84" r="2.5" fill="#CBB89D" />

  <!-- Education Current -->
  <text x="450" y="114" text-anchor="middle" class="current-degree">
    M.Sc. Artificial Intelligence and Robotics (AIRO) | Sapienza University of Rome
  </text>

  <!-- Education Previous -->
  <text x="450" y="138" text-anchor="middle" class="alumnus-degree">
    B.Sc. Applied Computer Science and Artificial Intelligence (ACSAI) Graduate
  </text>

  <!-- Fields of Focus -->
  <text x="450" y="168" text-anchor="middle" class="discipline-tags">
    ARTIFICIAL INTELLIGENCE &#8226; ROBOTICS &#8226; COMPUTER VISION &#8226; MULTI-AGENT SYSTEMS
  </text>
</svg>
