<svg width="100%" height="80" viewBox="0 0 900 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="footerWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <style>
    .quote {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-style: italic;
      font-size: 14px;
      fill: #94a3b8;
    }
    .author {
      font-weight: 600;
      fill: #38bdf8;
    }
  </style>

  <!-- Border & Background -->
  <rect x="2" y="2" width="896" height="76" rx="14" fill="url(#footerBg)" stroke="url(#footerBorder)" stroke-width="1.5" />

  <!-- Wave Accent -->
  <path d="M2 45 Q 230 15 450 50 T 898 35 L 898 76 L 2 76 Z" fill="url(#footerWave)" />

  <text x="450" y="44" text-anchor="middle" class="quote">
    “Passionate about AI, robotics, and using data to solve complex problems.”  —  <tspan class="author">Alessio Curcio</tspan>
  </text>
</svg>
