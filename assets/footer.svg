<svg width="100%" height="70" viewBox="0 0 900 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24070D" />
      <stop offset="50%" stop-color="#380D17" />
      <stop offset="100%" stop-color="#1A0409" />
    </linearGradient>

    <linearGradient id="footerLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBB89D" stop-opacity="0" />
      <stop offset="50%" stop-color="#CBB89D" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#CBB89D" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .footer-text {
      font-family: 'Cinzel', 'Playfair Display', 'Georgia', serif;
      font-size: 13px;
      letter-spacing: 2.5px;
      fill: #D4C5B9;
    }
    .footer-sub {
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      fill: #A88B7D;
    }
  </style>

  <!-- Frame -->
  <rect x="2" y="2" width="896" height="66" rx="6" fill="url(#footerBg)" stroke="#CBB89D" stroke-width="0.8" stroke-opacity="0.25" />

  <line x1="300" y1="18" x2="600" y2="18" stroke="url(#footerLine)" stroke-width="1" />
  <circle cx="450" cy="18" r="2" fill="#CBB89D" opacity="0.8" />

  <text x="450" y="40" text-anchor="middle" class="footer-text">
    INQUIRY &#8226; DISCIPLINE &#8226; MONOZUKURI
  </text>
  <text x="450" y="55" text-anchor="middle" class="footer-sub">
    SAPIENZA UNIVERSITY OF ROME &#8226; AIRO
  </text>
</svg>
